        <h1>Contato</h1>
        <p>Manda uma mensagem!</p>

    <main>
<section>
<form id="formulario-contato">

    <div class="campo">
<label for="nome"><i class="fa-solid fa-user"></i>Nome</label>
<input type="text" id="nome" placeholder="Seu nome completo">
    </div>

    <div class="campo">
<label for="email"><i class="fa-solid fa-envelope"></i>Email</label>
<input type="email" id="email" placeholder="Digite seu @email">
    </div>

    <div class="campo">
<label for="assunto"><i class="fa-solid fa-tag"></i>Assunto</label>
<input type="text" id="assunto" placeholder="Qual o assunto?">
    </div>

<div class="campo"> 
<label for="mensagem"><i class="fa-solid fa-message"></i>Mensagem</label>
<textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem..."></textarea>
</div>


<button type="submit"><i class="fa-solid fa-paper-plane"></i>Enviar mensagem</button>

</form>
</section>
